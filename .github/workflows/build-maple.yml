# 从上游 subframe7536/maple-font 的 variable 分支（V8 开发版）构建自定义 Maple Mono
#
# 产物组合（--width narrow 全局生效）：
#   1. Maple Mono          纯拉丁静态 ttf（8 字重 x 直/斜体）
#   2. Maple Mono 可变     纯拉丁可变字体（单文件全字重，默认总是构建）
#   3. Maple Mono NF       + Nerd Font 图标
#   4. Maple Mono CN       + 简体中文（无图标，来自 --cjk-both）
#   5. Maple Mono NF CN    + 简体中文 + 图标
#   6. Maple Mono CN 可变  中文可变字体（第二次构建 --cjk-variable 产出）
#
# 其它已选配置：
#   --format ttf     仅输出 ttf（可变 base 除外）
#   --line-height 0.886  行高对齐 LXGW WenKai Mono（1.170em vs 默认 1.32em）
#   --feat cv02,...   冻结 Playground 实测选定的字形与连字特性
#   中文默认 2:1 宽度、保留全部连字与 [TODO] 标签连字、Maple 个性化字形

name: Build Maple Mono

on:
  workflow_dispatch:
    inputs:
      force:
        description: '上游 commit 未变化时也强制重建'
        type: boolean
        default: false
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: build-maple-mono
  cancel-in-progress: false

env:
  # 公共构建参数：4 种组合 + 仅 ttf + narrow 宽度 + 行高对齐 LXGW WenKai + Playground 选定的特性冻结
  BUILD_ARGS: >-
    --cjk cn --cjk-both --nf
    --width narrow
    --format ttf
    --line-height 0.886
    --feat cv02,cv03,cv05,cv09,cv10,ss03,ss07,ss08,ss09,ss10,ss11

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout upstream maple-font (variable branch)
        uses: actions/checkout@v6
        with:
          repository: subframe7536/maple-font
          ref: variable
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          echo "::group::pip install -r requirements.txt"
          pip install -r requirements.txt
          echo "::endgroup::"

      - name: Resolve build metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=v8-${SHA}" >> "$GITHUB_OUTPUT"
          # 定时任务下，上游 commit 未变化则跳过，避免无意义构建
          SKIP=false
          if [ "${{ inputs.force }}" != "true" ] \
            && gh release view "v8-${SHA}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            SKIP=true
            echo "::notice::上游 commit v8-${SHA} 已存在 Release，本次跳过构建（手动触发可勾选 force 强制重建）"
            echo "上游 commit (v8-${SHA}) 已有 Release，本次跳过构建。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      # 第一次构建：静态输出（base / NF / CN / NF-CN 静态包 + base 可变包）
      # ::group:: 折叠构建脚本的全部输出（含 CJK 基础字体的下载日志）
      - name: Build static fonts
        if: steps.meta.outputs.skip != 'true'
        run: |
          echo "::group::python build.py (static pass)"
          python build.py ${{ env.BUILD_ARGS }} --archive
          echo "::endgroup::"
          echo "::group::Collect static archives"
          mkdir -p dist/static
          mv fonts/archive/*.zip dist/static/
          ls -lh dist/static
          echo "::endgroup::"

      # 第二次构建：CJK 输出为可变字体（--cache 复用第一次的拉丁基础产物）
      # 注：--cache 下第二次仍会归档复用的静态产物（与 dist/static/ 同名），
      # 同名 zip 必须跳过，否则 gh release create 会因 ReleaseAsset.name 重复报 422
      - name: Build variable CJK fonts
        if: steps.meta.outputs.skip != 'true'
        run: |
          echo "::group::python build.py (variable CJK pass)"
          python build.py ${{ env.BUILD_ARGS }} --cjk-variable --archive --cache
          echo "::endgroup::"
          echo "::group::Collect variable archives"
          mkdir -p dist/variable
          for f in fonts/archive/*.zip; do
            base="$(basename "$f")"
            if [ -f "dist/static/$base" ]; then
              echo "跳过与 static 重复的归档: $base"
            else
              mv "$f" dist/variable/
            fi
          done
          ls -lh dist/variable
          # 防御：至少应有中文可变字体新增归档，否则空 glob 会导致 gh 上传报错
          if ! ls dist/variable/*.zip >/dev/null 2>&1; then
            echo "::error::dist/variable 中没有任何新增归档，构建可能异常"
            exit 1
          fi
          echo "::endgroup::"

      # 在 Actions Summary 页生成中文摘要：上游信息 + 构建参数 + 产物清单
      - name: Write job summary
        if: steps.meta.outputs.skip != 'true'
        run: |
          {
            echo "## Maple Mono 构建摘要"
            echo
            echo "- 上游: [subframe7536/maple-font](https://github.com/subframe7536/maple-font) (variable) 分支 @ (v8-${{ steps.meta.outputs.sha }})"
            echo "- Release: [(${{ steps.meta.outputs.tag }})](https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }})"
            echo
            echo "### 构建参数"
            echo '```'
            echo "python build.py ${{ env.BUILD_ARGS }} --archive"
            echo "python build.py ${{ env.BUILD_ARGS }} --cjk-variable --archive --cache"
            echo '```'
            echo
            echo "### 产物清单"
            echo
            echo "| 分组 | 文件 | 大小 |"
            echo "| --- | --- | --- |"
            for f in dist/static/*.zip; do
              echo "| static | ($(basename "$f")) | $(du -h "$f" | cut -f1) |"
            done
            for f in dist/variable/*.zip; do
              echo "| variable | ($(basename "$f")) | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "> static/ 为静态字体包，variable/ 为中文可变字体包；压缩包内含对应 config 与 license。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: maple-mono-v8-${{ steps.meta.outputs.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Create release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Resolve effective config (build.py --dry)"
          python build.py ${{ env.BUILD_ARGS }} --dry | tee dry-config.txt
          echo "::endgroup::"
          {
            echo "## Maple Mono 自定义构建"
            echo
            echo "- 上游: [subframe7536/maple-font](https://github.com/subframe7536/maple-font) (variable) 分支 @ v8-${{ steps.meta.outputs.sha }}"
            echo
            echo "### 构建参数"
            echo '```'
            echo "python build.py ${{ env.BUILD_ARGS }} --archive"
            echo "python build.py ${{ env.BUILD_ARGS }} --cjk-variable --archive --cache"
            echo '```'
            echo
            echo "### 最终生效配置"
            echo '```'
            cat dry-config.txt
            echo '```'
            echo
            echo "> static/ 为静态字体包，variable/ 为中文可变字体包；压缩包内含对应 config 与 license。"
          } > NOTES
          echo "::group::gh release create ${{ steps.meta.outputs.tag }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          # 幂等处理：若 release 已存在（如上次 run 中途失败残留），覆盖上传 assets
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，覆盖上传 assets"
            gh release upload "$TAG" \
              dist/static/*.zip dist/variable/*.zip \
              --clobber -R "$REPO"
          else
            gh release create "$TAG" \
              dist/static/*.zip dist/variable/*.zip \
              --title "Maple Mono v8-${{ steps.meta.outputs.sha }}" \
              --notes-file NOTES \
              -R "$REPO"
          fi
          echo "::endgroup::"
